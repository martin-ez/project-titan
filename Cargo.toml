[package]
name = "titan"
version = "0.1.0"
edition = "2021"

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.19.1" }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

# Bevy's debug info is most of what a build writes and most of what the CI
# cache then stores, and a repository only gets 10 GiB of Actions cache before
# entries evict each other. Measured over a cold `cargo test --no-run`: 6.3 GB
# of artifacts at the default, 4.2 GB at line-tables-only, 1.6 GB with debug
# info off entirely. line-tables-only is the middle one on purpose — a panic
# backtrace keeps its file and line numbers, which is what a backtrace is read
# for, and only the variable and type information goes.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
