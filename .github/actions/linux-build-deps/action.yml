name: linux-build-deps
description: The system libraries Bevy's Linux backend resolves through pkg-config.

# Bevy links against ALSA for audio, udev for gamepad enumeration, and
# libwayland for the windowing backend winit selects on Linux. All three are
# resolved by build scripts through pkg-config, and a build script runs even
# under `cargo check`, so a missing one fails the build rather than only the
# run.
#
# Named here once rather than in each job that needs them. The two jobs each
# carried their own copy of the list and drifted apart, which is how the Bevy
# 0.19 upgrade left libwayland-dev off both of them. A job that cannot build
# saves no cache either, so that drift cost every run after it a cold build as
# well as a red one.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev libudev-dev libwayland-dev
