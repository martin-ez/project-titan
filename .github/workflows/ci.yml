name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each entry against the branches ahead of it, so this
  # is where a semantic conflict between two green pull requests is caught. A
  # required check that never reports here times the entry out and drops it.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two costs here, and they pull apart. Wall clock is the dependency cache
# hitting or not: 55s on an exact hit, 12-22m without one. Billed minutes are
# runner choice and job count, because Actions rounds every job up to a whole
# minute and a private repository gets 2,000 minutes a month.
#
# Hence no macOS runner: it bills at ten times the Linux rate, which made it
# 85% of the bill from 38% of the wall clock. That coverage moves to
# scripts/gate.sh, which a developer on macOS already runs before every push.
# Linux is the platform no local run covers, and the one that broke on Bevy
# 0.19. Cache size is held down in Cargo.toml, against a 10 GiB repository
# limit these caches were hitting.
#
# Not taken: dependency opt-level, which would build Bevy twice on a
# developer's machine; one build shared by both jobs, since clippy and rustc
# write different fingerprints; and save-if on main, which saves nothing while
# this concurrency group still cancels main's own runs (#42).

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # AGENTS.md rules rustc and clippy cannot express. They sit here rather
      # than in a job of their own because six seconds of shell in one bills
      # the same minute as sixty.
      - run: scripts/check-style.sh
      # The body check and the gate have no game to test through an App, so
      # they carry their own cases.
      - if: ${{ !cancelled() }}
        run: scripts/check-pr-body.sh --selftest
      - if: ${{ !cancelled() }}
        run: scripts/gate.sh --selftest
      # Every job runs on every push and skips its own steps instead. Gating
      # the job would stop it reporting, and a required check that never
      # reports blocks a pull request rather than passing it.
      - id: changed
        uses: ./.github/actions/rust-changed
      # Deliberately not cache-on-failure. A cache key cannot be overwritten
      # once written, so a build killed part way — which the concurrency group
      # above does on every new push — would save a partial target directory
      # and pin it there for that lockfile, leaving every later run to rebuild
      # the rest and unable to save the result.
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: ./.github/actions/linux-build-deps
      # `!cancelled()` keeps every check reporting after an earlier one fails,
      # so one job still says what separate jobs did.
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        run: cargo fmt --all -- --check
      # Linted rather than merely checked: clippy subsumes `cargo check`, and
      # one rustc wrapper keeps the two off each other's fingerprints.
      # --all-targets reaches the tests.
      - if: ${{ !cancelled() && steps.changed.outputs.rust != 'false' }}
        run: cargo clippy --all-targets
      # missing_docs catches undocumented public items, RUSTDOCFLAGS broken
      # intra-doc links. The examples themselves run as doctests in the test
      # job.
      - if: ${{ !cancelled() && steps.changed.outputs.rust != 'false' }}
        run: cargo doc --no-deps

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: ./.github/actions/rust-changed
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: ./.github/actions/linux-build-deps
      # The tests build a headless App, so no display is needed: a test that
      # needs a window tests the windowing system rather than this game.
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        run: cargo test
