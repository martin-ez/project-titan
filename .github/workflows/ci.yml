name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each entry against the branches ahead of it, so this
  # is where a semantic conflict between two green pull requests is caught. A
  # required check that never reports here times the entry out and drops it.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What a pull request costs here is the dependency cache missing, not this
# crate compiling: on an exact cache hit the test job finishes in under a
# minute, and on a partial one it spends twelve to twenty-two minutes building
# Bevy again. So everything below is aimed at the cache hitting rather than at
# running less.
#
# `cache-on-failure` is the first half of that. It defaults off, which makes a
# broken build self-sustaining — the run fails, saves nothing, and the next one
# starts cold and fails the same way. That is what kept the Linux jobs cold for
# every run after the Bevy 0.19 upgrade landed without libwayland-dev.
#
# Cache size is the second half, and it is spent in Cargo.toml rather than
# here: the debug info Bevy carries is most of what gets stored, and a
# repository only gets 10 GiB of Actions cache before entries start evicting
# each other.
#
# Levers weighed and not taken, so the next person does not re-weigh them:
# dropping macos-latest from pull requests buys nothing, because a warm macOS
# job is under a minute and the second platform is coverage rather than cost;
# lowering opt-level for dependencies under test would stop `cargo run` and
# `cargo test` sharing artifacts and so compile Bevy twice on a developer's
# machine to save CI time the cache already saves; one build shared between the
# checks and test jobs is not available, because clippy and rustc write
# different fingerprints, which is why the checks job lints rather than checks;
# and restricting the cache save to main — the usual answer to the 10 GiB
# budget — would save nothing at all while this concurrency group still
# cancels main's own runs.

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every job runs on every push, and the ones below skip their own steps.
      # Gating the job instead would stop it reporting, and a required check
      # that never reports blocks a pull request rather than passing it.
      - id: changed
        uses: ./.github/actions/rust-changed
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: ./.github/actions/linux-build-deps
      # These share a job because each is a second or two of work behind the
      # cache restore and apt. `!cancelled()` keeps every check reporting after
      # an earlier one fails, so one run still says what separate jobs did.
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        run: cargo fmt --all -- --check
      # Linted rather than merely checked: clippy subsumes what `cargo check`
      # would do, and one rustc wrapper keeps the two off each other's build
      # fingerprints. --all-targets reaches the tests, which are where most of
      # this crate's code is exercised.
      - if: ${{ !cancelled() && steps.changed.outputs.rust != 'false' }}
        run: cargo clippy --all-targets
      # Undocumented public items fail via missing_docs; broken intra-doc links
      # fail via RUSTDOCFLAGS. The examples themselves are compiled and run by
      # the test job, where plain `cargo test` covers doctests on both hosts.
      - if: ${{ !cancelled() && steps.changed.outputs.rust != 'false' }}
        run: cargo doc --no-deps

  style:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGENTS.md rules that rustc and clippy cannot express: no inline
      # comments, doc comment budgets, no TODO markers, no prose outside the
      # code beyond a folder README and the design under docs/, no
      # documentation of unbuilt features.
      - run: scripts/check-style.sh
      # The body check and the gate have no game to be tested through an App,
      # so they carry their cases with them, and those run wherever the scripts
      # can change.
      - if: ${{ !cancelled() }}
        run: scripts/check-pr-body.sh --selftest
      - if: ${{ !cancelled() }}
        run: scripts/gate.sh --selftest

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: ./.github/actions/rust-changed
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: ${{ runner.os == 'Linux' && steps.changed.outputs.rust != 'false' }}
        uses: ./.github/actions/linux-build-deps
      # The tests build a headless App, so no display is needed on either
      # runner: a test that requires a window is a test of the windowing
      # system rather than of this game.
      - if: ${{ steps.changed.outputs.rust != 'false' }}
        run: cargo test
